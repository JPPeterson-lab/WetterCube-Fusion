dependencies:
  idf: ">=5.5.0"
  espressif/mdns: "^1.4.0"
  lvgl/lvgl: "~8.4.0"
  bblanchon/arduinojson: "^7.0.0"
  # Nur fuer das ESP32-P4-Board (src/board/p4): Display-Controller, WLAN ueber den ESP32-C6 (esp_hosted)
  espressif/esp_codec_dev:
    version: "~1.5"
    rules:
      - if: "target == esp32p4"
  espressif/esp_lcd_ek79007:
    version: "^2.0.2"
    rules:
      - if: "target == esp32p4"
  # esp_hosted fest auf der Version, die zur Firmware des ESP32-C6 passt. Ohne Pin zog der Komponenten-Manager nach dem Loeschen der
  # Sperrdatei 3.1.0 nach (rc10: P4 ohne WLAN). Erst erhoehen, wenn die C6-Firmware dazu getestet ist.
  espressif/esp_hosted:
    version: "==3.0.10"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target == esp32p4"
