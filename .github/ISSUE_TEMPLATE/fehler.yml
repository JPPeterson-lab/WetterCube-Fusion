name: Fehler melden / Report a bug
description: Etwas funktioniert nicht wie erwartet / Something does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Firmware-Version / Firmware version
      description: Steht auf dem Hauptscreen unten bzw. im /log (z. B. 0.6.0)
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - Waveshare ESP32-S3-Touch-LCD-7B
        - Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
        - Anderes / other
    validations:
      required: true
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert? / What happened?
      description: Was hast du erwartet, was ist stattdessen passiert, wie lässt es sich wiederholen?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Text von /log
      description: "http://wettercube-fusion.local/log öffnen, den Text kopieren. Bitte vorher WLAN-Namen, Standort und Ähnliches entfernen, wenn du sie nicht veröffentlichen möchtest."
      render: text
